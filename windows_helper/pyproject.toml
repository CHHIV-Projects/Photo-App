[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "photo-organizer-windows-helper"
version = "0.4.0"
description = "Photo Organizer Windows Helper authenticated Source operations"
requires-python = ">=3.11,<3.13"
dependencies = ["pydantic==2.12.5"]

[project.scripts]
photo-organizer-windows-helper = "photo_organizer_windows_helper.cli:main"

[tool.setuptools]
packages = ["windows_helper_shared", "windows_helper_shared.identity", "photo_organizer_windows_helper"]

[tool.setuptools.package-dir]
windows_helper_shared = "../backend/app/windows_helper_shared"
photo_organizer_windows_helper = "src/photo_organizer_windows_helper"
